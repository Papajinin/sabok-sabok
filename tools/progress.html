<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사복사복 진도 보기</title>
  <style>
    body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; background: #F7F5EF; color: #1E2A4A; max-width: 480px; margin: 0 auto; padding: 24px 16px; line-height: 1.6; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    button { font: inherit; font-weight: 800; border-radius: 10px; padding: 10px 16px; border: 1.5px solid #6FD6A6; background: #D3EEDF; color: #1E2A4A; cursor: pointer; }
    .nav { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 12px; }
    .nav b { font-size: 18px; }
    .nav button { padding: 6px 14px; }
    .nav button:disabled { opacity: .3; }
    .card { background: #fff; border: 1.5px solid #E2DFD5; border-radius: 12px; padding: 14px 16px; margin-top: 10px; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
    .row span:first-child { color: #5A6378; }
    .row span:last-child { font-weight: 800; text-align: right; }
    .sub { font-size: 14px; color: #5A6378; padding-left: 12px; }
    .empty { color: #5A6378; text-align: center; padding: 12px 0; }
    select { font: inherit; padding: 6px; border-radius: 8px; }
    #msg { margin-top: 16px; color: #5A6378; font-size: 14px; }
  </style>
</head>
<body>
  <!-- 아빠 전용: 엄마가 그날 한 진도 보기 (읽기만). 앱 주소 뒤에 /tools/progress.html -->
  <h1>사복사복 · 진도 보기</h1>
  <button id="login" type="button">구글로 로그인</button>
  <div id="main" hidden>
    <div id="who"></div>
    <div class="nav">
      <button id="prev" type="button">‹</button>
      <b id="date"></b>
      <button id="next" type="button">›</button>
    </div>
    <div id="day"></div>
    <div id="total"></div>
  </div>
  <div id="msg"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../sync-config.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const msg = t => { $('msg').textContent = t; };
    const pad = n => String(n).padStart(2, '0');
    const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const WD = '일월화수목금토';
    const row = (a, b) => `<div class="row"><span>${a}</span><span>${b}</span></div>`;
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    let people = [], cur = 0, day = new Date();

    function render() {
      const p = people[cur];
      const k = keyOf(day);
      $('date').textContent = `${day.getMonth() + 1}월 ${day.getDate()}일 (${WD[day.getDay()]})`;
      $('next').disabled = k >= keyOf(new Date());
      const days = p.state.days;
      const d = days && days[k];
      if (!days) {
        $('day').innerHTML = '<div class="card empty">아직 날짜별 기록이 없어요.<br>앱이 새 버전(7)을 받은 날부터 쌓여요.</div>';
      } else if (!d) {
        $('day').innerHTML = '<div class="card empty">이날은 기록이 없어요.</div>';
      } else {
        const rate = d.n ? Math.round(d.ok / d.n * 100) : 0;
        const subj = Object.entries(d.s || {}).map(([s, n]) => `<div class="row sub"><span>${esc(s)}</span><span>${n}</span></div>`).join('');
        const mocks = (d.m || []).map(m => row('모의고사', `${esc(m.title)} ${m.avg}점`)).join('');
        $('day').innerHTML = `<div class="card">
          ${row('푼 문제', `${d.n}문제`)}
          ${d.n ? `<div class="row sub"><span>맞음 ${d.ok} · 틀림 ${d.n - d.ok}</span><span>${rate}%</span></div>` : ''}
          ${subj}
          ${row('오답노트에 넣음', `${d.nt || 0}문제`)}
          ${mocks}
        </div>`;
      }
      const s = p.summary;
      const last = p.updatedAt ? new Date(p.updatedAt) : null;
      $('total').innerHTML = `<div class="card">
        ${s && s.total ? row(`${s.round}회독`, `${s.solved.toLocaleString()} / ${s.total.toLocaleString()} (${Math.round(s.solved / s.total * 100)}%)`) : ''}
        ${row('마지막으로 저장', last ? `${last.getMonth() + 1}/${last.getDate()} ${pad(last.getHours())}:${pad(last.getMinutes())}` : '-')}
      </div>`;
    }

    if (!FIREBASE_CONFIG.apiKey) msg('Firebase가 연결되지 않았어요 (sync-config.js).');
    else {
      firebase.initializeApp(FIREBASE_CONFIG);
      const auth = firebase.auth(), db = firebase.firestore();
      db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); // Safari에서 연결이 멈추는 것 막기
      $('login').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
        .catch(() => auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()));
      $('prev').onclick = () => { day.setDate(day.getDate() - 1); render(); };
      $('next').onclick = () => { day.setDate(day.getDate() + 1); render(); };
      auth.onAuthStateChanged(async u => {
        if (!u) return;
        $('login').hidden = true;
        msg('불러오는 중…');
        try {
          const snap = await db.collection('users').get();
          people = [];
          snap.forEach(doc => {
            if (doc.id === u.uid) return; // 아빠 자기 기록은 빼고
            const d = doc.data();
            people.push({ email: d.email || '', state: d.state ? JSON.parse(d.state) : {}, summary: d.summary, updatedAt: d.updatedAt });
          });
          if (!people.length) return msg('볼 수 있는 기록이 없어요.');
          // 여러 명이면 고르기 (엄마 한 명이면 이름만)
          $('who').innerHTML = people.length > 1
            ? `<select id="pick">${people.map((p, i) => `<option value="${i}">${esc(p.email || '이메일 없음 (예전 기록)')}</option>`).join('')}</select>`
            : `<div class="sub" style="padding:0">${esc(people[0].email || '엄마')}</div>`;
          if ($('pick')) $('pick').onchange = e => { cur = Number(e.target.value); render(); };
          $('main').hidden = false;
          msg('');
          render();
        } catch (e) {
          msg(e.code === 'permission-denied' ? '읽을 수 없어요. 아빠 계정인지, Firebase 규칙을 게시했는지 확인해 주세요.' : '불러오지 못했어요: ' + e.message);
        }
      });
    }
  </script>
</body>
</html>
